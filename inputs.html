<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inputs</title>
</head>

<body>

    <h1>Preencha o formulário:</h1>
    <br>
    <label for="nome">Nome:</label>
    <input type="text" name="" id="nome">
    <br>
    <br>
    <label for="cpf">CPF:</label>
    <input type="text" name="" id="cpf">
    <br>
    <br>
    <label for="endereço">Endereço:</label>
    <input type="text" name="" id="endereço">
    <br>
    <br>
    <label for="celular">Celular:</label>
    <input type="number" name="" id="celular">
    <br>
    <br>
    <label for="email">Email:</label>
    <input type="text" name="" id="email">
    <br>
    <br>
    <label for="data de nascimento">Data de nascimento:</label>
    <input type="date" name="" id="data de nascimento">
    <br>
    <br>
    <label for="nome mãe">Nome da mãe:</label>
    <input type="text" name="" id="nome mãe">
    <br>
    <br>
    <label for="nome pai">Nome do pai:</label>
    <input type="text" name="" id="nome pai">
    <br>
    <br>
    <label for="idade">Idade:</label>
    <input type="number" name="" id="idade">
    <br>
    <br>

</body>

</html>
